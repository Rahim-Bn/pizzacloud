services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pizza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pizzadb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizza -d pizzadb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://pizza:${POSTGRES_PASSWORD}@db:5432/pizzadb
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
